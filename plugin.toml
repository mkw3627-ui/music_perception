[plugin]
id = "music_perception"
name = "为她所听"
description = "电脑音频感知中控：视频语音沿用 Whisper；专业歌声中日英四档独立识别、四档声部分离及试听，所有模型下载进度/速度可视化、GPU/CUDA 私有环境、自适应显存预算、已安装模型降档与用户许可 CPU 内存重载，应用声道调度与 AI 私有感知。"
short_description = "视频语音与专业歌声分离识别；应用声道及私有 AI 感知"
keywords = ["音乐", "歌词", "歌声", "视频语音", "中日英", "Whisper", "Qwen3-ASR", "节拍", "BPM", "music", "speech"]
# Historical manifest was version = "0.9.0"; version 跟随 pyproject [project].version。
version = "0.9.22"
type = "plugin"
entry = "plugin.plugins.music_perception:MusicPerceptionPlugin"

[plugin.author]
name = "Local N.E.K.O. Plugin"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

# Startup timeout covers only the N.E.K.O worker handshake and startup hook.
# Heavy Python/wheel/model preparation runs later and is NOT awaited by startup.
[plugin_runtime]
enabled = true
auto_start = true
timeout = 45
startup_failure = "warn"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "main"
title = "为她所听"
entry = "ui/panel.tsx"
context = "dashboard"
permissions = ["state:read", "action:call"]

[music_perception]
# fast: librosa 分析 + 低置信度启发式情绪；essentia: 需要用户自行安装受许可约束的模型。
emotion_mode = "fast"
emotion_models_dir = ""
# 附加用户明确授权的歌曲目录。默认仅允许 ~/Music、插件数据目录/music，及 N.E.K.O/jukebox/songs（如存在）
allowed_roots = []
max_seconds = 900
segment_seconds = 10

# 仅用于音乐识别。监听必须在面板明确开启，启用授权会保存在插件自己的数据文件中。
# YAMNet 将识别得分达到阈值的片段视为音乐；阈值越高越保守。
music_gate_score = 0.24

# 每累计多少秒的确认音乐便立即生成一次实时分析，播放不需要停止。
# 有效范围 8..60 秒，默认 20 秒；音频不会上传，只有结构化摘要可交给 AI。
live_segment_seconds = 20

# 可选高级节拍模型：指向用户在电脑上已安装的 Beat This! checkpoint。
# 还需在运行音乐分析的 Python 中额外安装 beat_this + torch；不影响基础模式启动。
# 默认为空，绝不虚构 downbeat。
beat_this_checkpoint = ""

# 原 Whisper 四档现在用于视频人物语音转写。中日英专业歌声四档放在
# data/models/singing_specialist，独立私有 Python 虚拟环境，不覆盖原权重。
# 兼容旧版配置保留为默认值；用户选择优先级更高，保存在插件数据目录。
lyrics_model = "base"
# 默认 CPU INT8；面板可选择 NVIDIA CUDA（GPU FP16），不兼容将明确回退 CPU。
lyrics_device = "cpu"
lyrics_cpu_threads = 2

# 公开 Whisper 权重下载：官方源失败时可尝试公共镜像；不会上传电脑声音。
lyrics_mirror_fallback = true

# Optional MDX-Net two-stem enhancement. OFF until explicitly selected in UI.
# Models are independently cached in data/models/stems and never bundled.
# Separate opt-in download after explicit UI confirmation. The model is SHA-256 verified before enabling.

# >>> STATIC ENTRIES (generated from @plugin_entry) >>>
# Generated by tools/sync_static_entries.py; do not edit by hand.

[[plugin.entries]]
id = "activate_singing_model"
name = "加载并实际试推理专业歌词模型"
description = "单独于视频语音工作进程；仅经过 SHA 校验和真实模型预热才启用"
input_schema = { type = "object", properties = { quality = { type = "string", enum = ["low", "medium", "high", "ultra"] }, device = { type = "string", enum = ["cpu", "cuda"] } }, required = ["quality", "device"] }

[[plugin.entries]]
id = "activate_verified_lyrics_model"
name = "验证并启用已下载的歌词模型"
description = "必须先校验SHA-256，再实际加载并执行CPU/CUDA静音推理，成功后才原子切换配置"
input_schema = { type = "object", properties = { quality = { type = "string", enum = ["low", "medium", "high", "ultra"] }, device = { type = "string", enum = ["cpu", "cuda"] } }, required = ["quality", "device"] }

[[plugin.entries]]
id = "ai_focus_audio_application"
name = "AI 指定要监听的有声应用"
description = "只对正在发声、身份经校验的应用切换独立采集；失败自动尝试恢复旧来源。需要已开启 AI 私有感知。"
input_schema = { type = "object", properties = { source_id = { type = "string", default = "" }, mode = { type = "string", default = "auto" } } }

[[plugin.entries]]
id = "analyze_song"
name = "分析整首歌"
description = "提取完整本地音乐的节奏、频谱、旋律近似曲线和情绪"
input_schema = { type = "object", properties = { path = { type = "string", description = "已授权音乐目录内的音频文件绝对路径，支持 WAV/MP3/FLAC/M4A/OGG 等" }, detail = { type = "string", enum = ["brief", "full"], description = "brief（默认）：AI友好摘要；full：含完整频谱数据" } }, required = ["path"] }

[[plugin.entries]]
id = "automatic_audio_check"
name = "自动检查音频环境与现有模型"
description = "点击一次：自动修复插件自有依赖、查模型文件并运行受限诊断；需另行同意才下载新模型；无法修复显示真实原因"
input_schema = { type = "object", properties = {  } }

[[plugin.entries]]
id = "cancel_singing_installation"
name = "中断正在执行的独立环境或模型安装"
description = "仅结束本插件当前启动的安装子进程，不触碰已验证模型文件"
input_schema = { type = "object", properties = { confirmed = { type = "boolean" } }, required = ["confirmed"] }

[[plugin.entries]]
id = "check_lyrics_gpu"
name = "检查歌词识别显卡兼容性"
description = "只运行一次独立 CTranslate2 CUDA 检查，不下载安装模型，也不打开系统声音。"
input_schema = { type = "object", properties = {  } }

[[plugin.entries]]
id = "check_stem_gpu"
name = "检测分离模型实际 CUDA Provider 与推理"
description = "独立进程验证GPU环境、DLL和模型；正在监听时只检查Provider避免额外占显存"
input_schema = { type = "object", properties = {  } }

[[plugin.entries]]
id = "cog_describe_v1"
name = "认知桥能力清单 v1"
description = "稳定只读接口（为她所想）：声明 music_perception 的 v1 只读感知能力与当前授权状态；不含正文、不截图、不录音、不发言、不改任何设置。"
input_schema = { type = "object", properties = {  } }

