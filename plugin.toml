name = "SHA 校验后切换人声分离模型"
description = "只在所选权重通过SHA-256后切换，不覆盖其它已下载模型，切换时关闭旧子进程"
input_schema = { type = "object", properties = { quality = { type = "string", default = "ultra" }, confirmed = { type = "boolean", default = false } } }

[[plugin.entries]]
id = "select_system_capture"
name = "经用户确认恢复原先的混音回环方式"
description = "系统回环会包含播放到所选扬声器的所有应用声音，不是逐应用分离"
input_schema = { type = "object", properties = { confirmed = { type = "boolean", default = false } } }

[[plugin.entries]]
id = "set_adaptive_resources"
name = "设置模型显存自适应与CPU内存授权"
description = "用户确认后才允许显存不足时降档/转CPU；所有模型仅复用本机SHA已校验权重。"
input_schema = { type = "object", properties = { domain = { default = "singing" }, enabled = { default = true }, reserve_mib = { default = 2048 }, cpu_fallback = { default = false }, gpu_ram_offload = {  }, confirmed = { default = false } } }

[[plugin.entries]]
id = "set_ai_delivery"
name = "允许AI静默读取所有已授权音频结果"
description = "单独用户授权；结构化音乐、视频语音与声道标签只供AI读取，不产生聊天消息；AI自行决定是否提及"
input_schema = { type = "object", properties = { enabled = { type = "boolean" } }, required = ["enabled"] }

[[plugin.entries]]
id = "set_ai_voice_playback"
name = "通知本插件 AI 语音正在输出"
description = "供 N.E.K.O TTS 宿主在播放开始/结束时调用；也可手动切换。未真实独立分轨时阻断混合识别。"
input_schema = { type = "object", properties = { active = { type = "boolean", default = false } } }

[[plugin.entries]]
id = "set_auto_vision_review"
name = "开关后台自动视觉复核"
description = "关闭后候选标签不再自动升级，视频语音通道保持关闭；不影响手动复核。"
input_schema = { type = "object", properties = { enabled = { type = "boolean", default = false } } }

[[plugin.entries]]
id = "set_capture_output"
name = "选择监听哪一个扬声器设备"
description = "切换前必须停止监听。AI 音色隔离需要 Windows 音量合成器将 AI 应用路由到另一输出。"
input_schema = { type = "object", properties = { output_id = { type = "string", default = "" }, ai_separate = { type = "boolean", default = false }, confirmed = { type = "boolean", default = false } } }

[[plugin.entries]]
id = "set_download_source"
name = "确认后保存模型下载来源优先级"
description = "仅改变官方/镜像尝试顺序，不下载、不上传音频"
input_schema = { type = "object", properties = { source = { type = "string", enum = ["mirror", "official"] }, confirmed = { type = "boolean" } }, required = ["source", "confirmed"] }

[[plugin.entries]]
id = "set_external_channel_share"
name = "授权另一个插件读取选中应用的结构化声音摘要"
description = "需经用户确认才更改，默认关闭。仅包含候选文本和事件，不提供原始PCM"
input_schema = { type = "object", properties = { enabled = { type = "boolean", default = false }, confirmed = { type = "boolean", default = false } } }

[[plugin.entries]]
id = "set_lyrics_device"
name = "设置歌词识别运行设备"
description = "兼容旧界面入口。必须通过本地 SHA-256 验证和 CPU/CUDA 实际预热后才能切换。"
input_schema = { type = "object", properties = { device = { type = "string", enum = ["cpu", "cuda"] } }, required = ["device"] }

[[plugin.entries]]
id = "set_lyrics_language"
name = "设置本地歌词识别语言"
description = "自动识别或中文/日文/英文固定转写；不影响声音监听、不重载模型权重"
input_schema = { type = "object", properties = { language = { type = "string", enum = ["auto", "zh", "ja", "en"] } }, required = ["language"] }

[[plugin.entries]]
id = "set_lyrics_quality"
name = "设置歌词识别模型档位"
description = "兼容旧界面入口；先下载和SHA校验，CPU/GPU试推理成功才保存新档位。"
input_schema = { type = "object", properties = { quality = { type = "string", enum = ["low", "medium", "high", "ultra"] } }, required = ["quality"] }

[[plugin.entries]]
id = "set_media_source_role"
name = "标记声音来自音乐、视频或 AI"
description = "只影响本地二次验证。按 Windows 媒体会话来源 ID 匹配，不能证明实际有声。"
input_schema = { type = "object", properties = { app = { type = "string", default = "" }, role = { type = "string", default = "unknown" } } }

[[plugin.entries]]
id = "set_stem_device"
name = "确认后选择人声分离运行设备"
description = "CPU默认可用；NVIDIA GPU是否可用需要ONNX Runtime CUDA Provider实际检验"
input_schema = { type = "object", properties = { device = { type = "string", enum = ["cpu", "cuda"] }, confirmed = { type = "boolean" } }, required = ["device", "confirmed"] }

[[plugin.entries]]
id = "set_stem_enhancement"
name = "设置不使用模型的自适应波形增强强度"
description = "轻柔／标准／强化／关闭；后续片段生效，可试听前后差异，可能损伤原始声音"
input_schema = { type = "object", properties = { strength = { type = "string", default = "balanced" } } }

[[plugin.entries]]
id = "set_stem_separation"
name = "开启或关闭本地人声/伴奏分离"
description = "可选UVR MDX-Net，需本机SHA校验通过；开启时仅分离已确认音乐，出错自动回原声。"
input_schema = { type = "object", properties = { enabled = { type = "boolean" } }, required = ["enabled"] }

[[plugin.entries]]
id = "set_stem_vocal_input"
name = "选择歌声ASR输入音轨"
description = "原始分离人声或波形增强人声；只改变后续识别使用的 PCM，不改变试听内容或下载模型。"
input_schema = { type = "object", properties = { source = { default = "raw" } } }

[[plugin.entries]]
id = "set_video_frame_budget"
name = "设置视频抽帧上限"
description = "每次视频最多送入视觉模型的帧数：10／30／50。"
input_schema = { type = "object", properties = { budget = { default = 10 } } }

[[plugin.entries]]
id = "set_video_mode"
name = "设置视频观看模式"
description = "balanced：画面+语音（默认）；efficient：仅画面，适合低配电脑。"
input_schema = { type = "object", properties = { mode = { default = "balanced" } } }

[[plugin.entries]]
id = "stage_lyrics_model"
name = "检查并下载所选歌词模型"
description = "先检查磁盘权重，不会把未校验的新档位保存为当前档位；公开文件下载显示实际进度"
input_schema = { type = "object", properties = { quality = { type = "string", enum = ["low", "medium", "high", "ultra"] }, download_source = { type = "string", enum = ["mirror", "official"] }, confirmed = { type = "boolean" } }, required = ["quality", "confirmed"] }

[[plugin.entries]]
id = "start_auto_listen"
name = "开启自动音乐识别"
description = "用户明确同意后开启系统扬声器回环监听；重新启动时继续运行。不会录麦克风或传输原始声音"
input_schema = { type = "object", properties = { consent = { type = "boolean" } }, required = ["consent"] }

[[plugin.entries]]
id = "start_stem_download"
name = "确认后下载并校验人声分离模型"
description = "独立后台下载约67MB官方SHA绑定的UVR ONNX，不上传音频，不自动启用；需用户在弹窗同意"
input_schema = { type = "object", properties = { confirmed = { type = "boolean" }, quality = { type = "string", enum = ["low", "medium", "high", "ultra"] }, download_source = { type = "string", enum = ["mirror", "official"] } }, required = ["confirmed"] }

[[plugin.entries]]
id = "stop_auto_listen"
name = "停止自动音乐识别"
description = "停止监听、撤回自动启动授权，丢弃未完成的音频片段"
input_schema = { type = "object", properties = {  } }

[[plugin.entries]]
id = "summon_glance_now"
name = "叫她看看屏幕"
description = "主人叫她看一眼。不指定 target 时模糊叫看：屏幕视频/音乐 → 有声应用 → 进程名；指定 target 时精确查找该对象，找不到如实说明。不占每日偷看次数，极度生气时拒绝。只读，不发布任何内容。"
input_schema = { type = "object", properties = { target = { type = "string" } } }

[[plugin.entries]]
id = "tell_ai"
name = "兼容入口：读取歌曲分析"
description = "旧接口不再触发角色发言；仅将上次分析结果返回给调用方，供 AI 自主决定如何使用"
input_schema = { type = "object", properties = {  } }

[[plugin.entries]]
id = "record_playback"
name = "为她而唱 · 录制当前播放"
description = "仅供「为她而唱」调用：把当前扬声器回环录成 WAV（默认 48kHz 立体声），同时记录媒体标题时间线，用于按换歌切分"
input_schema = { type = "object", properties = { duration = { type = "number", minimum = 10, maximum = 600 }, stereo = { type = "boolean", default = true } } }

[[plugin.entries]]
id = "uninstall_lyrics_model"
name = "卸载指定的插件私有歌词模型"
description = "确认后仅删除单一档位；auto_pause允许必要时安全暂停插件，卸载失败不清空当前配置"
input_schema = { type = "object", properties = { quality = { type = "string", enum = ["low", "medium", "high", "ultra"] }, auto_pause = { type = "boolean" }, confirmed = { type = "boolean" } }, required = ["quality", "confirmed"] }

[[plugin.entries]]
id = "uninstall_singing_environment"
name = "安全卸载歌声独立 Python 运行环境"
description = "只删除 singing_asr_venv，不删除专业歌词权重、视频 Whisper、分离环境和私有 CUDA"
input_schema = { type = "object", properties = { confirmed = { type = "boolean" } }, required = ["confirmed"] }

[[plugin.entries]]
id = "uninstall_singing_model"
name = "安全卸载单档专业歌词模型"
description = "仅删除本插件歌声模型目录；运行中先释放，文件锁定则报错且保留原配置"
input_schema = { type = "object", properties = { quality = { type = "string", enum = ["low", "medium", "high", "ultra"] }, confirmed = { type = "boolean" } }, required = ["quality", "confirmed"] }

[[plugin.entries]]
id = "uninstall_stem_model"
name = "卸载插件私有人声分离模型"
description = "确认后仅删除选定模型档位；auto_pause允许自动释放占用以解决Windows文件锁"
input_schema = { type = "object", properties = { confirmed = { type = "boolean" }, quality = { type = "string", enum = ["low", "medium", "high", "ultra"] }, auto_pause = { type = "boolean" } }, required = ["confirmed"] }

[[plugin.entries]]
id = "verify_current_video_source"
name = "复核当前选中的应用是视频还是音乐"
description = "后台同一条链路的手动版：窗口插件真实看帧 → 写成外部复核标签。仅逐进程采集且已选中应用时可用；无画面权限或没授权跨插件共享会如实报原因。"
input_schema = { type = "object", properties = { action = { type = "string", default = "review" } } }

[[plugin.entries]]
id = "verify_singing_import"
name = "校验用户手动下载的专业歌声模型"
description = "从插件数据目录本地读取官方模型文件，校验固定 SHA-256，无任何联网请求。"
input_schema = { type = "object", properties = { quality = { type = "string", enum = ["low", "medium", "high", "ultra"] }, confirmed = { type = "boolean" } }, required = ["quality", "confirmed"] }

[[plugin.entries]]
id = "verify_singing_local_files"
name = "校验已手动下载的专业歌词权重"
description = "只检查本地固定档位文件的官方 SHA-256，不下载、不改变当前模型"
input_schema = { type = "object", properties = { quality = { type = "string", enum = ["low", "medium", "high", "ultra"] } }, required = ["quality"] }

[[plugin.entries]]
id = "verify_stem_model_files"
name = "只读校验已有分离模型"
description = "检查模型哈希，完成后记录SHA结果；不会联网、不会启动GPU"
input_schema = { type = "object", properties = {  } }

[[plugin.entries]]
id = "visual_install_status"
name = "自动构建准备状态"
description = "读取插件可视化构建准备阶段（不会启动任何程序）"
input_schema = { type = "object", properties = {  } }
